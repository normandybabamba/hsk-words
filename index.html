<title>HSK 단어 서랍</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: 로그인 → iOS 카드 학습(한 손 폰 컬럼, 하단 탭바) ↔ 구석 ERP 버튼으로 사내 ERP 조회 화면. 데이터·진도는 하나. */
:root{
  --bg:#f2f2f7; --bg2:#e5e5ea; --card:#ffffff; --label:#000000; --sec:rgba(60,60,67,.6); --ter:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2); --seg:#ffffff;
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --purple:#af52de;
  --shadow:0 10px 30px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  --han:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  /* ERP 고정 팔레트 */
  --e-win:#d5e3f6; --e-strip:#c2d6f0; --e-panel:#e4edf9; --e-line:#9fb7d9; --e-grid:#d4d4d4; --e-head:#183a73; --e-soft:#7d8ba1; --e-sel:#3767b4; --e-thumb:#5584c6; --e-ro:#e9edf3;
  --gulim:"Gulim","굴림","GulimChe","Dotum","돋움",Tahoma,"Malgun Gothic",sans-serif;
  --ui:Tahoma,"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --bg2:#0d0d0f; --card:#1c1c1e; --label:#ffffff; --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36); --seg:#636366;
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#0d0d0f; --card:#1c1c1e; --label:#ffffff; --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36); --seg:#636366;
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg2);color:var(--label);margin:0;font:15px var(--sf);-webkit-text-size-adjust:100%;overscroll-behavior:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ===================== iOS ===================== */
.shell{height:100%;display:flex;justify-content:center}
.phone{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 0;min-height:44px}
.deckbtn{background:none;border:0;color:var(--blue);font-size:17px;display:flex;align-items:center;gap:4px;padding:4px 0}
.deckbtn svg{width:12px;height:12px}
.erp-pill{border:0;border-radius:999px;padding:6px 12px;background:var(--fill);font:700 12px var(--sf);letter-spacing:.08em;color:var(--label)}
.large{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
.sub{color:var(--sec);font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
.tab{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.study{padding:0 16px;flex:1;min-height:0;display:flex;flex-direction:column}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:7px 14px;background:var(--fill);font:500 14px var(--sf);position:relative;font-variant-numeric:tabular-nums}
.chip.on{background:var(--label);color:var(--bg)}
.chip.done::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--green);border:1.5px solid var(--bg)}
.segctl{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:10px 0 0}
.segctl button{flex:1;border:0;background:none;padding:6px 0;border-radius:7px;font:500 13px var(--sf)}
.segctl button.on{background:var(--seg);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.pbar{display:flex;gap:2px;height:4px;margin:12px 0 0}
.pbar i{flex:1;border-radius:2px;background:var(--fill2);transition:background .2s,transform .2s}
.pbar i.d{background:var(--green)} .pbar i.x{background:var(--orange)} .pbar i.cur{transform:scaleY(2);background:var(--blue)}
.stage{flex:1;position:relative;min-height:260px;margin:14px 0 8px}
.stage .ghost{position:absolute;inset:0;border-radius:26px;background:var(--card);opacity:.55;transform:translateY(10px) scale(.95)}
.stage .ghost.g2{opacity:.3;transform:translateY(19px) scale(.9)}
.card{position:absolute;inset:0;background:var(--card);border-radius:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:28px 22px;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;text-align:center}
.c-top{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sec);font-variant-numeric:tabular-nums}
.badge{padding:3px 9px;border-radius:999px;font-weight:600;font-size:12px}
.badge.d{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.badge.x{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--orange)}
.fld{position:relative;border-radius:12px;padding:2px 10px;max-width:100%;overflow-wrap:anywhere}
.f-h{font:500 60px/1.15 var(--han);letter-spacing:.02em}
.f-h.l5{font-size:46px}.f-h.l7{font-size:36px}.f-h.l10{font-size:28px}
.f-p{font-size:21px;color:var(--sec);letter-spacing:.01em}
.f-m{font-size:20px;font-weight:600;line-height:1.4;margin-top:10px}
.fld.hide{color:transparent!important;background:var(--fill);min-width:120px;cursor:pointer}
.fld.hide::after{content:"탭해서 보기";position:absolute;inset:0;display:grid;place-items:center;color:var(--ter);font:500 13px var(--sf);letter-spacing:0}
.f-h.hide{min-width:160px}
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);padding:10px 18px;border-radius:14px;font:700 18px var(--sf);color:#fff;opacity:0;pointer-events:none;white-space:nowrap}
.stamp.up{background:var(--green)} .stamp.down{background:var(--orange)}
.stamp.pop{animation:pop .75s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.96)}}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--sec);padding:20px}
.empty b{color:var(--label);font-size:19px}
.hint{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.hint button{border:0;background:var(--fill);border-radius:999px;padding:7px 12px;font:500 13px var(--sf);display:flex;align-items:center;gap:5px}
.hint .up{color:var(--green)} .hint .dn{color:var(--orange)}
.tools{display:flex;align-items:center;gap:8px;padding:0 0 10px}
.masks{display:flex;background:var(--fill);border-radius:10px;padding:2px;flex:1}
.masks button{flex:1;border:0;background:none;border-radius:8px;padding:7px 0;font:500 13px var(--sf);display:flex;align-items:center;justify-content:center;gap:4px}
.masks button.on{background:var(--seg);box-shadow:0 1px 4px rgba(0,0,0,.14);color:var(--blue)}
.masks svg{width:15px;height:15px}
.masks .sl{display:none}.masks button.on .sl{display:inline}
.round{width:38px;height:38px;flex:none;border:0;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.round svg{width:19px;height:19px;color:var(--blue)}
.round.on{background:var(--blue)} .round.on svg{color:#fff}
.tabbar{display:flex;border-top:.5px solid var(--sep);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font:500 10px var(--sf);color:var(--sec)}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:25px;height:25px}

.group{background:var(--card);border-radius:12px;overflow:hidden;margin:8px 0}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;width:100%;background:none;border:0;text-align:left;font-size:16px}
.li+.li::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.li.ind+.li.ind::before{left:62px}
.li.tap{cursor:pointer}.li.tap:active{background:var(--fill)}
.li .grow{flex:1;min-width:0}
.li small{display:block;color:var(--sec);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.li .chev{color:var(--ter);font-size:20px;line-height:1}
.li.red{color:var(--red)} .li.blue{color:var(--blue)}
.folder{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--c,var(--blue))}
.folder svg{width:20px;height:20px;color:#fff}
.more{border:0;background:var(--fill);width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1;color:var(--blue);flex:none}
.sect{font-size:13px;font-weight:400;color:var(--sec);text-transform:uppercase;letter-spacing:.04em;margin:22px 16px 4px}
.foot{color:var(--sec);font-size:13px;line-height:1.45;margin:6px 16px}
.wide{width:100%;border:0;border-radius:12px;padding:14px;background:var(--card);color:var(--blue);font:500 16px var(--sf);margin-top:8px}
.wide.pri{background:var(--blue);color:#fff}
.mini{height:4px;border-radius:2px;background:var(--fill2);overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;background:var(--green)}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill2);position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw:checked{background:var(--green)} .sw:checked::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:none;width:40px;height:32px;font-size:20px;color:var(--blue)}
.stepper b{min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;background:linear-gradient(160deg,#8e9aaf,#5c677d)}
.avatar.big{width:64px;height:64px;font-size:26px}
.ringbox{display:flex;align-items:center;gap:18px;padding:16px}
.ring{width:96px;height:96px;flex:none}
.ring text{fill:var(--label);font:700 22px var(--sf)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.kv span{color:var(--sec)} .kv b{text-align:right}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.dtile{border:0;background:var(--card);border-radius:12px;padding:10px;text-align:left;font-variant-numeric:tabular-nums}
.dtile b{display:block;font-size:15px}.dtile small{color:var(--sec);font-size:12px}
.dtile.on{outline:2px solid var(--blue)}
.dtile.done b::after{content:" ✓";color:var(--green)}

/* login */
.login{justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.appicon{width:84px;height:84px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(150deg,#ff5e57,#d7263d);color:#fff;font:700 46px var(--han);box-shadow:0 8px 20px rgba(215,38,61,.3)}
.login h1{text-align:center;font-size:28px;margin:0}
.login #lList>p{text-align:center;color:var(--sec);margin:6px 0 18px}
.pinwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.dots{display:flex;gap:18px;margin:8px 0 6px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--label)}
.dots i.on{background:var(--label)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 24px;margin-top:6px}
.key{width:76px;height:76px;border-radius:50%;border:0;background:var(--fill);font:400 32px var(--sf);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.key small{font-size:9px;letter-spacing:.2em;font-weight:600;margin-top:2px}
.key:active{background:var(--fill2)}
.key.txt{background:none;font-size:16px}
.pinmsg{min-height:20px;color:var(--red);font-size:14px}
.linkbtn{border:0;background:none;color:var(--blue);font-size:16px;padding:10px;display:block;margin:6px auto 0}

/* ===================== 공용 오버레이 ===================== */
.ov{position:fixed;inset:0;z-index:60;display:flex}
.ov .pb{overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.ov .lbl{font-size:13px;color:var(--sec)}
.ov .row2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.ov .row2 .sp{flex:1}
.ov .pwrap{max-height:42vh;overflow:auto;border-radius:10px}
.ov .ptable{border-collapse:collapse;width:100%;font-size:13px}
.ov .ptable td,.ov .ptable th{padding:5px 6px;text-align:left;vertical-align:top}
.ov .ptable td[contenteditable]{outline:none;min-width:40px}
.ov .ptable td.hz{font-family:var(--han);font-size:15px;white-space:nowrap}
.ov .ptable .del{border:0;background:none;color:var(--red);font-size:15px;padding:0 4px}
.ov .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ov .opt.han{font-family:var(--han);font-size:20px;text-align:center}
.ov .qmeta{display:flex;justify-content:space-between;font-size:13px}
.ov .qcard{display:grid;place-items:center;text-align:center;min-height:110px;padding:12px}
.ov .qcard .q{font:500 40px var(--han)}
.ov .qcard .q.ko{font:700 20px var(--sf)}
.ov .radio{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.ov .radio label{display:flex;gap:6px;align-items:center}
.ov .drop{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;padding:18px 12px;cursor:pointer}
.ov .note{font-size:13px;line-height:1.5}
.ov .list{display:flex;flex-direction:column}

/* iOS 시트 */
.ov.ios{background:rgba(0,0,0,.4);align-items:flex-end;justify-content:center}
.ov.ios .panel{width:100%;max-width:440px;max-height:92%;background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.ov.ios .ph{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;padding:14px 12px 8px;font:600 17px var(--sf);text-align:center;position:relative}
.ov.ios .ph::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;border-radius:3px;background:var(--fill2);transform:translateX(-50%)}
.ov.ios .ph button{grid-column:3;border:0;background:none;color:var(--blue);font:400 17px var(--sf);text-align:right}
.ov.ios .pb{padding:6px 16px 18px}
.ov.ios .btn{border:0;border-radius:12px;padding:13px 16px;background:var(--card);color:var(--blue);font:500 16px var(--sf)}
.ov.ios .btn.pri{background:var(--blue);color:#fff}
.ov.ios .btn.danger{color:var(--red)}
.ov.ios .btn.blk{width:100%}
.ov.ios .inp{width:100%;border:0;border-radius:10px;background:var(--card);padding:12px 14px;font:16px var(--sf);color:var(--label)}
.ov.ios .pwrap{background:var(--card)}
.ov.ios .ptable th{color:var(--sec);font-weight:500;position:sticky;top:0;background:var(--card)}
.ov.ios .ptable tr+tr td{border-top:.5px solid var(--sep)}
.ov.ios .opt{border:0;border-radius:12px;background:var(--card);padding:12px;min-height:54px;font:500 15px var(--sf);text-align:left}
.ov.ios .opt.ok{background:var(--green);color:#fff}.ov.ios .opt.ng{background:var(--red);color:#fff}
.ov.ios .qcard{background:var(--card);border-radius:16px}
.ov.ios .qmeta{color:var(--sec)}
.ov.ios .drop{background:var(--card);border-radius:12px;border:1.5px dashed var(--ter);color:var(--sec)}
.ov.ios .drop b{color:var(--blue);font-size:16px}
.ov.ios .note{color:var(--sec)}
.ov.ios .list .btn{border-radius:0;text-align:left;position:relative}
.ov.ios .list .btn:first-child{border-radius:12px 12px 0 0}.ov.ios .list .btn:last-child{border-radius:0 0 12px 12px}
.ov.ios .list .btn+.btn::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.ov.ios details summary{color:var(--blue);cursor:pointer}

/* ERP 다이얼로그 */
.ov.erp{background:rgba(40,60,90,.35);align-items:center;justify-content:center;padding:16px;font:12px var(--ui);color:#000}
.ov.erp .panel{width:min(560px,100%);max-height:94%;display:flex;flex-direction:column;background:var(--e-panel);border:1px solid #3f68a8;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.ov.erp .ph{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 8px;background:linear-gradient(#5d8fd6,#2c5aa5);color:#fff;font:bold 12px var(--gulim);letter-spacing:.08em}
.ov.erp .ph button{width:22px;height:18px;background:linear-gradient(#e7816d,#c7402a);border:1px solid #8c2a1b;color:#fff;font-size:0;border-radius:2px;position:relative}
.ov.erp .ph button::after{content:"✕";font-size:11px;position:absolute;inset:0;display:grid;place-items:center}
.ov.erp .pb{padding:12px 14px 14px}
.ov.erp .lbl{font:11.5px var(--gulim);letter-spacing:.1em;color:#111}
.ov.erp .btn{min-width:72px;height:26px;padding:0 10px;border:1px solid #5d82bd;background:linear-gradient(#eaf2fd,#bcd2f0);color:#1d3f7c;font:12px var(--gulim);letter-spacing:.08em;border-radius:2px;box-shadow:inset 0 1px 0 #fff}
.ov.erp .btn:hover{background:linear-gradient(#fff7da,#f9d778);border-color:#d39b14}
.ov.erp .btn.danger{color:#a0201a}
.ov.erp .inp{height:22px;border:1px solid #a5acb5;background:#fff;padding:1px 4px;font:12px var(--ui);width:100%;color:#000}
.ov.erp textarea.inp{height:auto}
.ov.erp .pwrap{background:#fff;border:1px solid #a5acb5;border-radius:0}
.ov.erp .ptable th{position:sticky;top:0;background:linear-gradient(#fff,#e3eaf4);color:var(--e-head);font:bold 12px var(--gulim);border-bottom:1px solid #a9b6c8}
.ov.erp .ptable td{border-bottom:1px solid #ececec;font-size:12px}
.ov.erp .opt{min-height:40px;border:1px solid #8ea8cf;background:linear-gradient(#fff,#e2ebf7);padding:4px 8px;text-align:left;font-size:12.5px;border-radius:2px;color:#000}
.ov.erp .opt:hover{border-color:#d39b14;background:linear-gradient(#fffbea,#fbe6a2)}
.ov.erp .opt.ok{background:#d6f1d0;border-color:#4b9b3c}.ov.erp .opt.ng{background:#f8d5cf;border-color:#c0402a}
.ov.erp .qcard{background:#fff;border:1px solid #a5acb5}
.ov.erp .qcard .q.ko{font:bold 18px var(--gulim)}
.ov.erp .qmeta{font:11px var(--gulim);color:#3b4f6e;letter-spacing:.05em}
.ov.erp .drop{background:#fff;border:1px dashed #5d82bd;color:#3b4f6e}
.ov.erp .drop b{color:#1d3f7c;font-family:var(--gulim)}
.ov.erp .note{color:#3b4f6e}
.ov.erp .list{gap:4px}

<script>
/* ===== 단어 파일 인식기: 표의 행(row)마다 한자 / 병음 / 한글 뜻을 문자 종류로 구분 ===== */
const WP=(()=>{
const isH=c=>/[\u3400-䶿一-\u9fff豈-﫿〇]/.test(c);
const isK=c=>/[가-힣ㄱ-ㆎ]/.test(c);
const isL=c=>/[A-Za-zÀ-ÖØ-öø-ɏ]/.test(c);
const HEAD=/^(no\.?|번호|순번|중국어|한자|단어|병음.*|pinyin|뜻.*|의미|한국어.*|meaning|hanzi|chinese|korean|중국어\s*쓰기|뜻\s*쓰기)$/i;
const norm=s=>String(s||"").normalize("NFC").replace(/[ 　]/g," ").replace(/\s+/g," ").trim();
function tokenizeCell(text){
  const segs=[];let pend="",cur=null,sawK=false;
  for(const ch of text){
    const t=isH(ch)?"H":isK(ch)?"K":isL(ch)?"L":"O";
    if(t==="O"){if(cur)cur.s+=ch;else pend+=ch;continue}
    if(cur&&cur.t===t){cur.s+=ch;continue}
    if(cur&&t!=="H"&&cur.t!=="H"&&/[(（\[]\s*$/.test(cur.s)&&cur.t==="K"){cur.s+=ch;continue}
    if(t==="K"&&cur&&cur.t==="L"){const mm=cur.s.match(/\s(\d+)\s*$/);if(mm){cur.s=cur.s.slice(0,mm.index);pend=mm[1]+pend}}
    if(cur&&cur.t==="L"&&t==="K")cur.beforeK=true;
    cur={t,s:pend+ch,first:!segs.length,afterK:sawK};pend="";segs.push(cur);if(t==="K")sawK=true;
  }
  return segs.map(g=>{let s=g.s.trim();
    if(g.t==="H")s=s.replace(/^\d+[.)]\s*|^\d+\s+/,"").replace(/[\s,，;；/]+$/,"");
    else s=s.replace(/^[\s,;/·\-–]+|[\s,;/·\-–]+$/g,"");
    return Object.assign(g,{s})}).filter(g=>g.s);
}
const jn=(a,b,sep=" ")=>a?a+sep+b:b;
function rowsToWords(rows){
  const out=[];let cur=null,prevWord=false;
  for(const cells of rows){
    let hasNum=false;const toks=[];
    for(const raw of cells){const c=norm(raw);if(!c)continue;
      if(/^\d+[.)]?$/.test(c)){hasNum=true;continue}
      if(HEAD.test(c))continue;
      toks.push(...tokenizeCell(c))}
    if(!toks.length){if(!cells.length)prevWord=false;continue}
    const starts=[];toks.forEach((t,i)=>{if(t.t==="H"&&t.first)starts.push(i)});
    if(starts.length){
      starts.forEach((s,k)=>{
        const g=toks.slice(k===0?0:s,k+1<starts.length?starts[k+1]:toks.length);
        const w={h:"",p:"",m:""};let hd=false;
        for(const t of g){
          if(t.t==="H"){if(!hd&&t.first){w.h=t.s;hd=true}else w.m=jn(w.m,t.s,"")}
          else if(t.t==="L"&&!t.afterK&&!(w.p&&t.beforeK&&!/[\u00c0-\u024f]/.test(t.s)))w.p=jn(w.p,t.s);
          else w.m=jn(w.m,t.s,t.first?", ":" ");
        }
        out.push(w);cur=w});
      prevWord=true;
    }else if(cur&&prevWord&&!hasNum&&(cur.p||cur.m)){
      const txt=norm(cells.join(" "));
      if(txt.length<=40&&!/[|]/.test(txt)){for(const t of toks){if(t.t==="L"&&!t.afterK&&!(t.first===false&&cur.m&&false))cur.p=jn(cur.p,t.s);else cur.m=jn(cur.m,t.s)}}
      else prevWord=false;
    }else prevWord=false;
  }
  return out.filter(w=>w.h&&(w.p||w.m)).map(w=>[w.h,w.p,w.m]);
}
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  const delim=(text.split("\n").slice(0,20).join("").match(/\t/g)||[]).length>2?"\t":",";
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c;continue}
    if(c==='"'&&!f)q=true;else if(c===delim){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}
function textToRows(text){
  const lines=text.split(/\r?\n/);
  if(lines.filter(l=>/\t/.test(l)).length>lines.length*.3||lines.filter(l=>/,/.test(l)).length>lines.length*.5)return parseCSV(text);
  return lines.map(l=>l.split(/\s{3,}/));
}
function decode(buf){
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^﻿/,"")}
  catch(e){try{return new TextDecoder("euc-kr").decode(buf)}catch(e2){return new TextDecoder().decode(buf)}}
}
/* pdf.js 텍스트 조각 → 줄 → 칸 */
function pdfItemsToRows(items){
  const its=items.filter(i=>i.str&&i.str.trim()).map(i=>{const fs=Math.hypot(i.transform[2],i.transform[3])||Math.abs(i.transform[3])||10;return{s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||fs*i.str.length*.5,fs}});
  its.sort((a,b)=>b.y-a.y||a.x-b.x);
  const lines=[];
  for(const it of its){const L=lines.find(l=>Math.abs(l.y-it.y)<=it.fs*.45);if(L)L.items.push(it);else lines.push({y:it.y,items:[it]})}
  lines.sort((a,b)=>b.y-a.y);
  lines.forEach(l=>{l.fs=l.items[0].fs;l.cells=lineCells(l);const t=l.cells.map(c=>c.s).join(" ");
    l.anchor=l.cells.some(c=>/^\s*\d*\s*[\u3400-\u9fff]/.test(c.s))||l.cells.some(c=>/^\d+[.)]?$/.test(c.s.trim()));l.txt=t});
  /* 칸 안에서 두 줄로 넘어간 뜻/병음은 가장 가까운 단어 줄에 붙인다 (세로 가운데 정렬 표 대응) */
  const anchors=lines.filter(l=>l.anchor);
  lines.forEach(l=>{if(l.anchor||l.txt.length>40||/[|]/.test(l.txt))return;
    let best=null,bd=1e9;anchors.forEach(a=>{const d=Math.abs(a.y-l.y);if(d<bd){bd=d;best=a}});
    if(!best||bd>l.fs*1.6)return;
    const plan=[];
    for(const c of l.cells){if(HEAD.test(norm(c.s)))return;
      let tc=null,td=1e9;best.cells.forEach(b=>{const d=Math.abs(b.x-c.x);if(d<td){td=d;tc=b}});
      const kind=s=>/[\uac00-\ud7a3]/.test(s)?"K":/[\u3400-\u9fff]/.test(s)?"H":/^\s*\d+[.)]?\s*$/.test(s)?"N":"L";
      if(kind(c.s)==="H"||kind(c.s)==="N")return;
      if(!tc||td>l.fs*1.5){if(c.x<=Math.max(...best.cells.map(b=>b.x)))return;plan.push([null,c]);continue}
      if(kind(tc.s)!==kind(c.s))return;
      plan.push([tc,c.s])}
    plan.forEach(([tc,s])=>{if(!tc){best.cells.push({x:s.x,s:s.s});return}(l.y>best.y?(tc.pre=tc.pre||[]):(tc.post=tc.post||[])).push(s)});
    l.merged=true});
  const rows=[];let py=null;
  lines.forEach(l=>{if(l.merged)return;if(py!==null&&py-l.y>l.fs*1.75)rows.push([]);py=l.y;
    l.cells.sort((a,b)=>a.x-b.x);rows.push(l.cells.map(c=>[...(c.pre||[]),c.s,...(c.post||[])].join(" ")))});
  rows.push([]);return rows;
  function lineCells(l){l.items.sort((a,b)=>a.x-b.x);const cells=[];let last=null;
    for(const it of l.items){if(last&&it.x-(last.x+last.w)<=it.fs*1.1){cells[cells.length-1].s+=(it.x-(last.x+last.w)>it.fs*.2&&!/[\d㐀-鿿]$/.test(cells[cells.length-1].s)||it.x-(last.x+last.w)>it.fs*.2&&!/^[㐀-鿿]/.test(it.s)?" ":"")+it.s}else cells.push({x:it.x,s:it.s});last=it}
    return cells}
}
function htmlTablesToRows(html){
  const doc=new DOMParser().parseFromString(html,"text/html");const rows=[];
  const trs=doc.querySelectorAll("tr");
  if(trs.length){trs.forEach(tr=>rows.push([...tr.children].map(td=>{const ps=td.querySelectorAll("p");return ps.length?[...ps].map(p=>p.textContent).join(" "):td.textContent})))}
  else doc.querySelectorAll("p,li").forEach(p=>rows.push(p.textContent.split(/\t|\s{3,}/)));
  return rows;
}
function dedupe(list,existing){
  const seen=new Set(existing||[]);const out=[];let dup=0;
  for(const w of list){if(seen.has(w[0])){dup++;continue}seen.add(w[0]);out.push(w)}
  return{words:out,dup};
}
return{rowsToWords,parseCSV,textToRows,decode,pdfItemsToRows,htmlTablesToRows,dedupe,tokenizeCell};
})();


</script>

/* 서버 모드: Supabase RPC (supabase/schema.sql 의 hsk_* 함수) */
async function rpc(fn,args){
  const headers={"Content-Type":"application/json",apikey:CFG.supabaseKey};
  if(/^eyJ/.test(CFG.supabaseKey))headers.Authorization="Bearer "+CFG.supabaseKey;
  let r;try{r=await fetch(String(CFG.supabaseUrl).replace(/\/+$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers,body:JSON.stringify(args||{})})}
  catch(e){throw new Error("NET")}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok)throw new Error((j&&j.message)||("HTTP "+r.status));
  return j}

/* 스와이프: 좌우 = 카드 넘김, 위 = 외움, 아래 = 헷갈림(카드 그대로) */
const card=$("iCard");let drag=null;
card.addEventListener("pointerdown",e=>{if(!M.list.length||e.button>0||e.target.closest("button"))return;ac();drag={x:e.clientX,y:e.clientY,t:performance.now(),ax:null,id:e.pointerId};try{card.setPointerCapture(e.pointerId)}catch(_){}card.style.transition="none"});
card.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.ax&&Math.hypot(dx,dy)>8)drag.ax=Math.abs(dx)>Math.abs(dy)?"x":"y";
  if(drag.ax==="x")card.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;
  else if(drag.ax==="y"){const r=Math.sign(dy)*Math.min(150,Math.abs(dy)*.5);card.style.transform=`translateY(${r}px) scale(${1-Math.abs(r)/1500})`;
    const u=$("stUp"),d=$("stDn");if(u){u.style.opacity=Math.max(0,Math.min(1,-dy/90));d.style.opacity=Math.max(0,Math.min(1,dy/90))}}});
function endDrag(e,cancel){if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,dt=Math.max(1,performance.now()-drag.t),ax=drag.ax;drag=null;
  if(cancel){spring();return}
  if(!ax){spring();tapCard(e);return}
  if(ax==="x"){if(Math.abs(dx)>70||(Math.abs(dx)>25&&Math.abs(dx)/dt>.45))nav(dx<0?1:-1);else spring();return}
  if(Math.abs(dy)>55||(Math.abs(dy)>20&&Math.abs(dy)/dt>.45))swipeMark(dy<0?"d":"x");else spring()}
card.addEventListener("pointerup",e=>endDrag(e,false));card.addEventListener("pointercancel",e=>endDrag(e,true));
function spring(){card.style.transition="transform .42s cubic-bezier(.3,1.5,.5,1)";card.style.transform="";const u=$("stUp"),d=$("stDn");if(u&&!u.classList.contains("pop"))u.style.opacity="";if(d&&!d.classList.contains("pop"))d.style.opacity=""}
function tapCard(e){const el=document.elementFromPoint(e.clientX,e.clientY);const f=el&&el.closest(".fld");
  if(f&&f.classList.contains("hide")){M.rev.add(f.dataset.f);renderCard()}
  else if(f&&f.dataset.f==="h"){say(M.list[M.idx].han)}
  else if(Object.values(A.set.mask).some(Boolean)){M.rev.add("all");renderCard()}}
let navBusy=false;
function nav(dir){const n=M.idx+dir;if(n<0||n>=M.list.length){spring();toast(n<0?"첫 카드예요":(M.day<nDays()?`Day ${M.day}의 마지막 카드예요`:"마지막 카드예요"));return}
  if(navBusy)return;navBusy=true;card.style.transition="transform .2s ease-in, opacity .2s";card.style.transform=`translateX(${-dir*115}%) rotate(${-dir*9}deg)`;card.style.opacity="0";
  setTimeout(()=>{M.idx=n;M.rev.clear();renderCard();renderBar();card.style.transition="none";card.style.transform=`translateX(${dir*55}%)`;void card.offsetWidth;
    card.style.transition="transform .3s cubic-bezier(.2,.8,.2,1), opacity .22s";card.style.transform="";card.style.opacity="1";savePos();navBusy=false},190)}
function swipeMark(kind){const w=M.list[M.idx];if(!w){spring();return}mark(w,kind);(kind==="d"?ding:dung)();
  spring();renderCard();const st=$(kind==="d"?"stUp":"stDn");st.style.opacity="";st.classList.add("pop");
  renderBar();$("iSub").textContent=subLine();
  if(kind==="d"&&dayDone(M.day)){setTimeout(dayComplete,650);return}
  if(A.set.auto&&M.idx<M.list.length-1)setTimeout(()=>nav(1),450)}
function bump(kind){if(!M.list.length)return;card.style.transition="transform .12s ease-out";card.style.transform=`translateY(${kind==="d"?-36:36}px)`;setTimeout(()=>swipeMark(kind),110)}
function dayComplete(){const k=M.day,last=k>=nDays();modal(`Day ${k} 완료`,`<div class="qcard"><div><div class="q ko" style="font-size:22px">Day ${k}의 ${dayWords(k).length}단어를 모두 외웠어요</div><div class="note" style="margin-top:6px">헷갈림으로 표시했던 단어도 외움으로 바뀌었어요</div></div></div>
  <div class="row2">${last?"":`<button class="btn pri blk" id="dcNext">Day ${k+1} 시작하기</button>`}<button class="btn blk" id="dcStay">계속 보기</button></div>`);
  const n=$("dcNext");n&&(n.onclick=()=>{closeModal();goDay(k+1)});$("dcStay").onclick=closeModal;$("toast").hidden=true;renderStudy()}
function goDay(k){M.day=k;M.order=null;buildList();savePos();renderStudy()}
$("iDays").onclick=e=>{const b=e.target.closest("[data-day]");if(b)goDay(+b.dataset.day)};
$("iFilter").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;A.set.filter=b.dataset.f;saveSet();buildList(M.list[M.idx]&&M.list[M.idx].han);renderStudy()};
$("iMasks").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;A.set.mask[b.dataset.k]=A.set.mask[b.dataset.k]?0:1;saveSet();M.rev.clear();renderStudy()};
$("iSay").onclick=()=>{const w=M.list[M.idx];w&&say(w.han)};
$("iShuf").onclick=()=>{M.order=M.order?null:1;buildList();renderStudy();toast(M.order?"순서를 섞었어요":"원래 순서로 돌아왔어요")};
$("iQuiz").onclick=()=>startQuiz(dayWords(M.day),A.set.dir);
$("iUp").onclick=()=>{ac();bump("d")};$("iDn").onclick=()=>{ac();bump("x")};

const PDFJS="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
const MAMMOTH="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js";
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return}const s=document.createElement("script");s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error("파일 읽기 도구를 불러오지 못했어요"));document.head.appendChild(s)})}
async function readPDF(buf){if(!window.pdfjsLib)await loadScript(PDFJS+"pdf.min.js");if(!window.pdfjsWorker)await loadScript(PDFJS+"pdf.worker.min.js");
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,disableFontFace:true,cMapUrl:"https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/",cMapPacked:true}).promise;
  const rows=[];for(let i=1;i<=doc.numPages;i++){const tc=await (await doc.getPage(i)).getTextContent();rows.push(...WP.pdfItemsToRows(tc.items))}return rows}
async function readDOCX(buf){if(!window.mammoth)await loadScript(MAMMOTH);const r=await mammoth.convertToHtml({arrayBuffer:buf});return WP.htmlTablesToRows(r.value)}
async function parseFile(file){const buf=await file.arrayBuffer();const ext=(file.name.split(".").pop()||"").toLowerCase();
  let rows;if(ext==="pdf")rows=await readPDF(buf);else if(ext==="docx")rows=await readDOCX(buf);
  else if(["csv","tsv","txt"].includes(ext))rows=WP.textToRows(WP.decode(buf));
  else throw new Error("PDF, CSV, TXT, Word(.docx) 파일만 올릴 수 있어요");
  return WP.rowsToWords(rows)}
let UP=null;
function openUpload(deckId){if(!needAdmin())return;UP={deck:deckId||A.deck.id,rows:[],name:"",newName:""};
  modal("단어 올리기",`<span class="lbl">넣을 서랍</span>
   <select class="inp" id="uDeck">${A.decks.map(d=>`<option value="${esc(d.id)}" ${d.id===UP.deck?"selected":""}>${esc(d.name)} (${deckStats(d).n})</option>`).join("")}<option value="__new">+ 새 서랍 만들기</option></select>
   <input class="inp" id="uNew" maxlength="30" placeholder="새 서랍 이름 (예: HSK 5급)" hidden>
   <label class="drop" for="uFile"><b>파일 선택</b><span>PDF · CSV · Word(.docx) · TXT</span><span style="font-size:12px">표의 한 행에 중국어, 병음, 뜻이 있으면 자동으로 찾아요</span></label>
   <input type="file" id="uFile" accept=".pdf,.csv,.tsv,.txt,.docx,application/pdf,text/csv" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
   <details><summary>직접 붙여넣기</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><textarea class="inp" id="uPaste" rows="5" placeholder="经验丰富, jīngyàn fēngfù, 경험이 풍부하다&#10;热情可爱  rèqíng kě'ài  열정적이고 사랑스럽다"></textarea><button class="btn" id="uPasteGo">인식하기</button></div></details>
   <div class="note" id="uMsg"></div>`);
  $("uDeck").onchange=e=>{$("uNew").hidden=e.target.value!=="__new";if(e.target.value==="__new")$("uNew").focus()};
  $("uFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;$("uMsg").textContent=`${f.name} 읽는 중…`;
    try{const rows=await parseFile(f);UP.name=f.name;uPreview(rows)}catch(err){$("uMsg").textContent=(err&&err.message?err.message:"파일을 읽지 못했어요")+" · 다른 파일로 다시 시도하거나 붙여넣기를 써 보세요."}};
  $("uPasteGo").onclick=()=>{const t=$("uPaste").value;if(!t.trim()){$("uMsg").textContent="붙여넣을 단어가 없어요.";return}UP.name="붙여넣기";uPreview(WP.rowsToWords(WP.textToRows(t)))}}
function uPreview(rows){
  if(!rows.length){$("uMsg").textContent="중국어 단어를 찾지 못했어요. 한 행에 ‘중국어 · 병음 · 뜻’이 있는 표인지 확인해 주세요.";return}
  const sel=$("uDeck").value;UP.deck=sel;UP.newName=sel==="__new"?($("uNew").value.trim()||UP.name.replace(/\.[^.]+$/,"")||"새 서랍"):"";
  const d=A.decks.find(x=>x.id===sel);const dname=d?d.name:UP.newName,dn=d?deckStats(d).n:0;
  const dd=WP.dedupe(rows);UP.rows=dd.words;
  modal("단어 확인",`<div class="note"><b>${esc(UP.name)}</b>에서 ${dd.words.length}개를 찾았어요${dd.dup?` (파일 안 중복 ${dd.dup}개 제외)`:""}. 칸을 눌러 고치거나 ✕로 뺄 수 있어요.</div>
   <div class="note">넣을 서랍: <b>${esc(dname)}</b>${d?` · 지금 ${dn}단어`:" · 새로 만들어요"}</div>
   ${d&&dn?`<div class="radio"><label><input type="radio" name="uMode" value="add" checked> 기존 단어 뒤에 추가</label><label><input type="radio" name="uMode" value="rep"> 서랍 비우고 교체</label></div>`:""}
   <div class="pwrap"><table class="ptable"><thead><tr><th>#</th><th>중국어</th><th>병음</th><th>뜻</th><th></th></tr></thead><tbody id="uTb">${UP.rows.map((w,i)=>`<tr><td style="color:var(--sec);opacity:.7">${i+1}</td><td class="hz" contenteditable="true">${esc(w[0])}</td><td contenteditable="true">${esc(w[1])}</td><td contenteditable="true">${esc(w[2])}</td><td><button class="del" aria-label="빼기">✕</button></td></tr>`).join("")}</tbody></table></div>
   <div class="row2"><button class="btn" id="uBack">다시 고르기</button><span class="sp"></span><button class="btn pri" id="uSave">서랍에 넣기</button></div>`);
  $("uTb").onclick=e=>{const b=e.target.closest(".del");if(b)b.closest("tr").remove()};
  $("uBack").onclick=()=>openUpload(UP.deck==="__new"?A.deck.id:UP.deck);
  $("uSave").onclick=async()=>{const list=[...$("uTb").querySelectorAll("tr")].map(tr=>{const c=tr.children;return[c[1].textContent.trim(),c[2].textContent.trim(),c[3].textContent.trim()]}).filter(w=>w[0]);
    if(!list.length){toast("넣을 단어가 없어요");return}
    const m=document.querySelector('input[name="uMode"]:checked');const replace=!!m&&m.value==="rep";
    $("uSave").disabled=true;$("uSave").textContent="넣는 중…";
    try{let id=UP.deck;if(id==="__new"){const r=await call("deckCreate",UP.newName,COLORS[A.decks.length%COLORS.length]);A.decks=r.decks;id=r.id}
      const r=await call("putWords",id,WP.dedupe(list).words,replace);A.decks=r.decks;
      closeModal();savePos();await openDeck(id);if(A.view==="ios")M.tab="tStudy";render();
      toast(`${A.deck.name}에 ${r.added}단어를 넣었어요${r.dup?` · 이미 있던 ${r.dup}개 제외`:""}`)}
    catch(e){const b=$("uSave");if(b){b.disabled=false;b.textContent="서랍에 넣기"}}}}

/* ===================== 테스트 (두 화면 공용) ===================== */
let Q=null;
function startQuiz(pool,dir){if(A.words.length<2){toast("단어가 2개 이상 있어야 테스트할 수 있어요");return}
  if(!pool.length)pool=A.words;const qs=shuffle(pool).slice(0,Math.min(20,pool.length));Q={qs,k:0,ok:0,dir:dir||"h2k",pool:pool.length>=4?pool:A.words};askQ()}
function askQ(){const{qs,k,dir}=Q;if(k>=qs.length)return endQ();const w=qs[k];
  const others=shuffle(Q.pool.filter(o=>o.han!==w.han&&o.mn!==w.mn)).slice(0,3);const opts=shuffle([w,...others]);
  const qt=dir==="k2h"?`<div class="q ko">${esc(w.mn)}</div>`:dir==="p2k"?`<div class="q ko">${esc(w.py)}</div>`:`<div class="q">${esc(w.han)}</div>`;
  modal("테스트",`<div class="qmeta"><span>${k+1} / ${qs.length}</span><span>정답 ${Q.ok}</span></div><div class="qcard">${qt}</div>
   <div class="opts">${opts.map((o,j)=>`<button class="opt ${dir==="k2h"?"han":""}" data-j="${j}">${j+1}. ${esc(dir==="k2h"?o.han:o.mn)}</button>`).join("")}</div>
   <div class="row2"><button class="btn" id="qSay">🔊 발음</button><span class="sp note" id="qMsg"></span><button class="btn pri" id="qNext" hidden>다음</button></div>`,()=>render());
  $("qSay").onclick=()=>say(w.han);let done=false;
  $("ovB").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;done=true;const good=opts[+b.dataset.j]===w;
    $("ovB").querySelectorAll(".opt").forEach(x=>{if(opts[+x.dataset.j]===w)x.classList.add("ok")});if(!good)b.classList.add("ng");
    if(good){Q.ok++;touchSave(w);ding()}else{mark(w,"x");dung()}
    $("qMsg").textContent=`${good?"정답":"오답"} · ${w.han} ${w.py}`;$("qNext").hidden=false;$("qNext").focus()});
  $("qNext").onclick=()=>{Q.k++;askQ()}}
function endQ(){const{ok,qs}=Q;modal("테스트 결과",`<div class="qcard"><div><div class="q ko" style="font-size:28px">${ok} / ${qs.length}</div><div class="note">정답률 ${Math.round(ok/qs.length*100)}% · 틀린 단어는 헷갈림으로 표시했어요</div></div></div>
  <div class="row2"><button class="btn" id="qWrong">헷갈림 모아보기</button><span class="sp"></span><button class="btn" id="qAgain">다시 풀기</button><button class="btn pri" id="qClose">닫기</button></div>`,()=>render());
  const dir=Q.dir;$("qAgain").onclick=()=>startQuiz(A.view==="ios"?dayWords(M.day):E.rows,dir);$("qClose").onclick=closeModal;
  $("qWrong").onclick=()=>{closeModal();if(A.view==="ios"){A.set.filter="x";saveSet();buildList();M.tab="tStudy";renderIOS()}else{$("cState").value="wrong";erpRead();erpRefresh()}}}
function openHelp(){modal("사용법",`<div class="help note" style="font-size:14px;line-height:1.6">
<p><b>카드 화면</b> 좌우로 넘기면 같은 Day의 단어를 오가요. 위로 올리면 ‘외움’, 아래로 내리면 ‘헷갈림’으로 체크돼요. 카드는 넘어가지 않아요.</p>
<p><b>가리기</b> 한자·병음·뜻 버튼으로 가리고, 가려진 칸을 누르면 보여요. 보이는 한자를 누르면 발음이 나와요.</p>
<p><b>ERP 화면</b> 같은 서랍과 진도를 사내 ERP 조회 화면처럼 표로 봐요. 체크한 내용은 두 화면이 같이 써요.</p>
<p><b>키보드</b> <kbd>←</kbd><kbd>→</kbd> 넘기기 · <kbd>↑</kbd> 외움 · <kbd>↓</kbd> 헷갈림 · <kbd>Space</kbd> 보기 · <kbd>S</kbd> 발음 (ERP: <kbd>↑</kbd><kbd>↓</kbd> 이동, <kbd>Space</kbd> 외움)</p>
<p><b>서랍</b> 급수·교재별로 서랍을 나눠요. 관리자가 PDF·CSV·Word 파일을 올리면 모든 계정이 같이 보고, 진도는 계정마다 따로 쌓여요.</p></div>`)}

/* ===================== ERP 화면 ===================== */
const E={rows:[],cur:0,order:null,sortK:null,sortD:1,rev:new Set(),f:{d1:1,d2:1,state:"all",q:""}};
function switchView(v){if(v==="erp"){const w=M.list[M.idx];E.f.d1=E.f.d2=M.day;E.f.state="all";E.f.q="";E.order=null;E.sortK=null;show("erp");erpRefresh(w&&w.han)}
  else{const w=E.rows[E.cur];if(w){M.day=dayOf(w);M.order=null;buildList(w.han);if(!M.list.some(x=>x.han===w.han)){A.set.filter="all";buildList(w.han)}savePos()}M.tab="tStudy";show("ios")}}
function erpEnter(){$("eUser").textContent=A.user.name;erpMenus();erpCondFill();erpRefresh()}
function erpAll(){$("eUser").textContent=A.user.name;erpMenus();erpCondFill();erpRefresh(E.rows[E.cur]&&E.rows[E.cur].han)}
function erpMenus(){
  $("eMenu").innerHTML=`<button data-m="file">파일</button><span class="msep"></span>${A.decks.map(d=>`<button data-m="deck:${esc(d.id)}" class="${d.id===A.deck.id?"on":""}">${esc(d.name)}</button>`).join("")}<span class="msep"></span><button data-m="today">현재일차</button><button data-m="alld">전체일차</button><button data-m="todo">미암기</button><button data-m="done">외움</button><button data-m="wrong">헷갈림</button><span class="msep"></span><button data-m="test">테스트</button><button data-m="acct">계정</button><button data-m="help">A/S</button>`;
  $("eDocTab").textContent="HSK 단어 암기 조회 - "+A.deck.name}
function erpCondFill(){const n=nDays(),opt=Array.from({length:n},(_,i)=>`<option value="${i+1}">Day ${i+1}</option>`).join("");
  $("cD1").innerHTML=opt;$("cD2").innerHTML=opt;E.f.d1=Math.min(E.f.d1,n);E.f.d2=Math.min(Math.max(E.f.d2,E.f.d1),n);$("cD1").value=E.f.d1;$("cD2").value=E.f.d2;
  $("cDeck").innerHTML=A.decks.map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join("");$("cDeck").value=A.deck.id;
  $("cState").value=E.f.state;$("cQ").value=E.f.q;$("cH").checked=!!A.set.mask.h;$("cP").checked=!!A.set.mask.p;$("cM").checked=!!A.set.mask.m;$("dDir").value=A.set.dir}
function erpRead(){E.f.d1=+$("cD1").value||1;E.f.d2=Math.max(E.f.d1,+$("cD2").value||1);E.f.state=$("cState").value;E.f.q=$("cQ").value}
function sortVal(w,k){const s=Pg(w);return{day:w.i,no:w.i,han:w.han,py:strip(w.py),mn:w.mn,memo:s.m||"",done:s.d||0,wrong:s.x||0,cnt:s.c||0,last:s.t||""}[k]}
function erpFilter(){const q=E.f.q.trim().toLowerCase(),pq=strip(q);
  let v=A.words.filter(w=>{const d=dayOf(w);if(d<E.f.d1||d>E.f.d2)return false;const s=Pg(w);
    if(E.f.state==="todo"&&s.d)return false;if(E.f.state==="done"&&!s.d)return false;if(E.f.state==="wrong"&&!s.x)return false;
    if(q&&!(w.han.includes(q)||strip(w.py).includes(pq)||w.mn.toLowerCase().includes(q)||(s.m||"").toLowerCase().includes(q)))return false;return true});
  if(E.order)v.sort((a,b)=>E.order[a.i]-E.order[b.i]);else if(E.sortK)v.sort((a,b)=>{const x=sortVal(a,E.sortK),y=sortVal(b,E.sortK);return(x>y?1:x<y?-1:0)*E.sortD});
  E.rows=v}
function erpRefresh(han){erpFilter();E.cur=0;if(han){const k=E.rows.findIndex(w=>w.han===han);if(k>=0)E.cur=k}erpRender();const tr=$("eTb").querySelector(`tr[data-r="${E.cur}"]`);tr&&tr.scrollIntoView({block:"nearest"})}
function erpRender(){const m=A.set.mask;let h="";
  E.rows.forEach((w,r)=>{const s=Pg(w),rv=E.rev.has(w.i),mh=m.h&&!rv,mp=m.p&&!rv,mm=m.m&&!rv;
    h+=`<tr data-r="${r}" class="${r===E.cur?"cur":""} ${s.d?"done":""}"><td class="ind">${r===E.cur?"❯":""}</td><td class="c">Day ${dayOf(w)}</td><td class="c">${w.no}</td><td class="hz ${r===E.cur?"focus":""} ${mh?"masked":""}" data-rev>${esc(w.han)}</td><td class="${mp?"masked":""}" data-rev>${esc(w.py)}</td><td class="mn ${mm?"masked":""}" data-rev title="${mm?"":esc(w.mn)}">${esc(w.mn)}</td><td>${esc(s.m||"")}</td><td class="c"><input type="checkbox" class="cb" data-d ${s.d?"checked":""} aria-label="외움"></td><td class="c"><input type="checkbox" class="cb red" data-x ${s.x?"checked":""} aria-label="헷갈림"></td><td class="c">${s.c||""}</td><td class="c">${s.t||""}</td></tr>`});
  $("eTb").innerHTML=h||`<tr><td colspan="11" style="text-align:center;padding:20px;color:#667">${A.words.length?"조건에 맞는 단어가 없습니다. 조회조건을 바꿔보세요.":isAdmin()?"서랍이 비어 있습니다. 툴바의 [올리기]로 파일을 넣어 주세요.":"서랍이 비어 있습니다. 관리자가 단어를 올리면 표시됩니다."}</td></tr>`;
  document.querySelectorAll("#erp thead th[data-k]").forEach(th=>{const a=th.querySelector(".arr");a&&a.remove();if(th.dataset.k===E.sortK&&!E.order)th.insertAdjacentHTML("beforeend",`<span class="arr">${E.sortD>0?"▲":"▼"}</span>`)});
  erpDetail();erpStats()}
function erpDetail(){const w=E.rows[E.cur];$("eRec").textContent=`Record ${E.rows.length?E.cur+1:0} of ${E.rows.length}`;
  if(!w){["dSrc","dDay","dNo","dTot","dHan","dPy","dMean","dCnt","dMemo"].forEach(i=>$(i).value="");$("dSrc").value=A.deck.name;return}
  const s=Pg(w),m=A.set.mask,rv=E.rev.has(w.i);
  $("dSrc").value=A.deck.name;$("dDay").value=`Day ${dayOf(w)} / ${nDays()}`;$("dNo").value=w.no;$("dTot").value=`~ ${A.words.length}`;
  $("dHan").value=w.han;$("dPy").value=w.py;$("dMean").value=w.mn;$("dCnt").value=`학습 ${s.c||0}회${s.t?" · "+String(s.t).slice(5):""}`;$("dMemo").value=s.m||"";$("dState").value=s.x?2:s.d?1:0;
  $("dHan").classList.toggle("masked",!!m.h&&!rv);$("dPy").classList.toggle("masked",!!m.p&&!rv);$("dMean").classList.toggle("masked",!!m.m&&!rv)}
function erpStats(){const s=deckStats(A.deck);$("sDone").textContent=s.d;$("sWrong").textContent=s.x;$("sTodo").textContent=s.n-s.d;
  $("sBar").style.width=(s.n?s.d/s.n*100:0).toFixed(1)+"%";$("eCnt").textContent=`외움 ${s.d} / ${s.n}`}
function eGo(r){if(!E.rows.length)return;E.cur=Math.max(0,Math.min(E.rows.length-1,r));erpRender();const tr=$("eTb").querySelector(`tr[data-r="${E.cur}"]`);tr&&tr.scrollIntoView({block:"nearest"})}
const ePg=()=>Math.max(5,Math.floor($("gwrap").clientHeight/22)-2);
function eToggle(kind){const w=E.rows[E.cur];if(!w)return;const s=Pg(w);mark(w,(kind==="d"?s.d:s.x)?null:kind);erpRender()}
$("eTb").addEventListener("click",e=>{const tr=e.target.closest("tr[data-r]");if(!tr)return;const r=+tr.dataset.r,w=E.rows[r];
  if(e.target.matches("[data-d]"))mark(w,e.target.checked?"d":null);
  else if(e.target.matches("[data-x]"))mark(w,e.target.checked?"x":null);
  else if(e.target.closest("[data-rev]")&&Object.values(A.set.mask).some(Boolean)&&!E.rev.has(w.i)){E.rev.add(w.i);touchSave(w)}
  E.cur=r;erpRender()});
$("eTb").addEventListener("dblclick",e=>{const tr=e.target.closest("tr[data-r]");if(tr)say(E.rows[+tr.dataset.r].han)});
document.querySelectorAll("#erp thead th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;E.order=null;if(E.sortK===k)E.sortD=-E.sortD;else{E.sortK=k;E.sortD=1}erpRefresh(E.rows[E.cur]&&E.rows[E.cur].han)});
document.querySelectorAll("#erp .nav button").forEach(b=>b.onclick=()=>{const n=b.dataset.n;
  if(n==="first")eGo(0);else if(n==="last")eGo(E.rows.length-1);else if(n==="p")eGo(E.cur-1);else if(n==="n")eGo(E.cur+1);else if(n==="pp")eGo(E.cur-ePg());else if(n==="nn")eGo(E.cur+ePg());else if(n==="done")eToggle("d");else if(n==="wrong")eToggle("x")});
$("bPrev").onclick=()=>eGo(E.cur-1);$("bNext").onclick=()=>eGo(E.cur+1);
$("bSay").onclick=()=>{const w=E.rows[E.cur];w&&say(w.han)};
const eShow=()=>{const w=E.rows[E.cur];if(w&&!E.rev.has(w.i)){E.rev.add(w.i);touchSave(w)}erpRender()};
$("bShow").onclick=eShow;$("dMean").onclick=$("dPy").onclick=$("dHan").onclick=eShow;
$("dState").onchange=e=>{const w=E.rows[E.cur];if(!w)return;const v=+e.target.value;mark(w,v===1?"d":v===2?"x":null);erpRender()};
$("dMemo").onchange=e=>{const w=E.rows[E.cur];if(!w)return;setMemo(w,e.target.value);erpRender()};
$("dNo").onkeydown=e=>{if(e.key==="Enter"){const n=+e.target.value;const r=E.rows.findIndex(w=>w.no===n);if(r>=0){eGo(r);return}const w=A.words[n-1];if(w){E.f.d1=Math.min(E.f.d1,dayOf(w));E.f.d2=Math.max(E.f.d2,dayOf(w));erpCondFill();erpRefresh(w.han)}}};
$("dDir").onchange=e=>{A.set.dir=e.target.value;saveSet()};
["cD1","cD2","cState"].forEach(i=>$(i).onchange=()=>{erpRead();if(E.f.d2<E.f.d1){E.f.d2=E.f.d1;$("cD2").value=E.f.d1}E.order=null;erpRefresh()});
$("cQ").oninput=()=>{erpRead();erpRefresh()};
$("cDeck").onchange=async e=>{savePos();await openDeck(e.target.value);E.f.d1=E.f.d2=M.day;erpAll()};
[["cH","h"],["cP","p"],["cM","m"]].forEach(([i,k])=>$(i).onchange=e=>{A.set.mask[k]=e.target.checked?1:0;saveSet();E.rev.clear();erpRender()});
$("eMenu").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const m=b.dataset.m;
  if(m==="file")return openUpload(A.deck.id);if(m==="test")return startQuiz(E.rows,A.set.dir);if(m==="help")return openHelp();
  if(m==="acct"){modal("계정",`<div class="list"><button class="btn" id="acNew">새 계정 만들기</button><button class="btn" id="acOut">로그아웃</button></div><div class="note">현재 사용자: ${esc(A.user.name)}${isAdmin()&&REMOTE?" (관리자)":""}</div>`);$("acNew").onclick=openSignup;$("acOut").onclick=logout;return}
  if(m.startsWith("deck:")){savePos();await openDeck(m.slice(5));E.f.d1=E.f.d2=M.day;E.f.state="all";erpAll();return}
  if(m==="today"){E.f.d1=E.f.d2=M.day}else if(m==="alld"){E.f.d1=1;E.f.d2=nDays()}else E.f.state=m;
  E.order=null;erpCondFill();erpRefresh();document.querySelectorAll("#eMenu button").forEach(x=>x.classList.toggle("on",x===b||x.dataset.m==="deck:"+A.deck.id))};
$("tbOpen").onclick=()=>openUpload(A.deck.id);
$("tbNew").onclick=()=>{E.order={};A.words.forEach(w=>E.order[w.i]=Math.random());erpRefresh()};
$("tbSave").onclick=()=>eToggle("d");
$("tbDel").onclick=()=>confirmBox("진도 초기화",`${esc(A.deck.name)} 서랍의 ${esc(A.user.name)}님 외움·헷갈림·메모 기록을 지웁니다. 단어는 지워지지 않습니다.`,"삭제",async()=>{await flush();await call("clearProgress",A.deck.id);A.prog={};E.rev.clear();erpRender();toast("진도를 초기화했습니다")});
$("tbMask").onclick=()=>{A.set.mask.m=A.set.mask.m?0:1;saveSet();$("cM").checked=!!A.set.mask.m;E.rev.clear();erpRender()};
$("tbQuiz").onclick=$("bTest").onclick=()=>startQuiz(E.rows,A.set.dir);
$("tbHelp").onclick=openHelp;
$("eX").onclick=()=>{$("cQ").value="";erpRead();erpRefresh()};
$("eMobile").onclick=()=>switchView("ios");$("eLogout").onclick=logout;

/* ---------- 키보드 ---------- */
document.addEventListener("keydown",e=>{
  if(!$("ov").hidden){if(e.key==="Escape")closeModal();else if(Q&&/^[1-4]$/.test(e.key)){const b=$("ovB").querySelectorAll(".opt")[+e.key-1];b&&b.click()}else if(Q&&e.key==="Enter"){const n=$("qNext");if(n&&!n.hidden){e.preventDefault();n.click()}}return}
  if(!$("login").hidden&&!$("lPin").hidden){if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==="Backspace")pinKey("지우기");else if(e.key==="Escape")pinKey("취소");return}
  if(!A.token||e.target.matches("input:not([type=checkbox]),select,textarea,[contenteditable]"))return;
  if(A.view==="ios"&&M.tab==="tStudy"){
    if(e.key==="ArrowLeft"){e.preventDefault();nav(-1)}else if(e.key==="ArrowRight"){e.preventDefault();nav(1)}
    else if(e.key==="ArrowUp"){e.preventDefault();ac();bump("d")}else if(e.key==="ArrowDown"){e.preventDefault();ac();bump("x")}
    else if(e.key===" "){e.preventDefault();M.rev.add("all");renderCard()}else if(e.key.toLowerCase()==="s"){const w=M.list[M.idx];w&&say(w.han)}}
  else if(A.view==="erp"){
    if(e.key==="ArrowDown"){e.preventDefault();eGo(E.cur+1)}else if(e.key==="ArrowUp"){e.preventDefault();eGo(E.cur-1)}
    else if(e.key==="PageDown"){e.preventDefault();eGo(E.cur+ePg())}else if(e.key==="PageUp"){e.preventDefault();eGo(E.cur-ePg())}
    else if(e.key===" "){e.preventDefault();eToggle("d")}else if(e.key==="Enter")eShow();else if(e.key.toLowerCase()==="s"){const w=E.rows[E.cur];w&&say(w.han)}}});

/* ---------- 시작 ---------- */
(async()=>{
  if(!REMOTE)Local.seed();
  const ss=LS.get("hsk.session",null);
  if(ss&&ss.token&&!!ss.remote===REMOTE){try{await enterSession(ss.token);return}catch(e){LS.del("hsk.session");if(String(e.message)!=="AUTH")toast(errText(e))}}
  showLogin();
})();
</script>
